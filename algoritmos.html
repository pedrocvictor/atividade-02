<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoritmos — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14151d;
    --bg-panel: #1b1d29;
    --bg-panel-raised: #21232f;
    --bg-input: #10111a;
    --border: #2c2f3e;
    --border-soft: #24263380;
    --text: #e6e6ee;
    --text-dim: #9a9cb0;
    --text-faint: #63667c;
    --accent: #f2b134;
    --accent-dim: #8a6a1f;
    --ok: #6fd08c;
    --err: #f27d7d;
    --tab-active: #14151d;
    --scrollbar: #33364a;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f3f6;
      --bg-panel: #ffffff;
      --bg-panel-raised: #ebebf2;
      --bg-input: #ffffff;
      --border: #dcdce4;
      --border-soft: #dcdce480;
      --text: #1c1d27;
      --text-dim: #5c5e70;
      --text-faint: #8b8da0;
      --accent: #b8790f;
      --accent-dim: #e8c988;
      --ok: #257a44;
      --err: #b23b3b;
      --tab-active: #ffffff;
      --scrollbar: #d3d3dd;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f3f6;
    --bg-panel: #ffffff;
    --bg-panel-raised: #ebebf2;
    --bg-input: #ffffff;
    --border: #dcdce4;
    --border-soft: #dcdce480;
    --text: #1c1d27;
    --text-dim: #5c5e70;
    --text-faint: #8b8da0;
    --accent: #b8790f;
    --accent-dim: #e8c988;
    --ok: #257a44;
    --err: #b23b3b;
    --tab-active: #ffffff;
    --scrollbar: #d3d3dd;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--bg-panel-raised);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ec6a5e; }
  .dot.y { background: #f4bf4f; }
  .dot.g { background: #61c454; }
  .topbar-title {
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .topbar-title b { color: var(--text); font-weight: 600; }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-panel-raised);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px 0;
  }
  .sidebar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    padding: 0 16px 10px;
    font-weight: 600;
  }
  .file-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 2px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-item:hover { background: var(--border-soft); color: var(--text); }
  .file-item.active {
    background: var(--tab-active);
    color: var(--text);
    border-left-color: var(--accent);
  }
  .file-icon {
    width: 8px; height: 8px; border-radius: 2px;
    flex-shrink: 0;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--tab-active);
  }

  .pane-header {
    padding: 18px 24px 4px;
  }
  .pane-title {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  .pane-desc {
    color: var(--text-dim);
    font-size: 14px;
    margin: 6px 0 0;
    max-width: 62ch;
    line-height: 1.5;
  }

  .pane-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px 32px;
  }

  .field-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 14px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .field input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 8px 10px;
    width: 260px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }

  .run-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #16171f;
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 16px;
    cursor: pointer;
    margin-top: 4px;
  }
  .run-btn:hover { filter: brightness(1.06); }
  .run-btn:active { filter: brightness(0.94); }
  .run-btn svg { width: 12px; height: 12px; }

  .console {
    margin-top: 20px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .console-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel-raised);
  }
  .console-bar span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 600;
  }
  .console-body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 60px;
    max-height: 340px;
    overflow-y: auto;
  }
  .console-body .muted { color: var(--text-faint); }
  .console-body .ok { color: var(--ok); }
  .console-body .err { color: var(--err); }
  .console-body .accent { color: var(--accent); }
  .console-line { display: block; }

  .theme-toggle {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--text-faint); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    .layout { flex-direction: column; overflow: visible; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 10px 0;
      white-space: nowrap;
    }
    .sidebar-label { display: none; }
    .file-item { border-left: none; border-bottom: 2px solid transparent; flex-shrink: 0; }
    .file-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    body { min-height: 100dvh; }
    .field input { width: 100%; min-width: 180px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  <div class="topbar-title">algoritmos <b>— console de execução</b></div>
  <button class="theme-toggle" id="themeToggle" type="button">tema</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="pane-header">
      <h1 class="pane-title" id="paneTitle"></h1>
      <p class="pane-desc" id="paneDesc"></p>
    </div>
    <div class="pane-body">
      <div id="fieldsHost"></div>
      <button class="run-btn" id="runBtn" type="button">
        <svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5v9l8-4.5-8-4.5z"/></svg>
        Executar
      </button>
      <div class="console">
        <div class="console-bar"><span>Debug Console</span><span id="statusTag" class="muted" style="font-family: var(--mono);"></span></div>
        <div class="console-body" id="consoleBody"><span class="muted console-line">// aguardando execução...</span></div>
      </div>
    </div>
  </main>
</div>

<script>
// ---------------------------------------------------------
// Algoritmos (portados de algoritmos.js)
// ---------------------------------------------------------
function ehPrimo(n) {
  if (!Number.isInteger(n) || n < 2) return false;
  if (n === 2) return true;
  if (n % 2 === 0) return false;
  for (let i = 3; i * i <= n; i += 2) {
    if (n % i === 0) return false;
  }
  return true;
}

function somatorio(numeros) {
  return numeros.reduce((acumulado, atual) => acumulado + atual, 0);
}

function fibonacci(n) {
  if (n < 0) throw new Error("N deve ser maior ou igual a 0");
  if (n === 0) return 0;
  if (n === 1) return 1;
  let anterior = 0, atual = 1;
  for (let i = 2; i <= n; i++) {
    const proximo = anterior + atual;
    anterior = atual;
    atual = proximo;
  }
  return atual;
}

function sequenciaFibonacci(n) {
  const termos = [];
  for (let i = 0; i <= n; i++) termos.push(fibonacci(i));
  return termos;
}

function mdc(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b !== 0) {
    const resto = a % b;
    a = b; b = resto;
  }
  return a;
}

function quicksort(array) {
  if (array.length <= 1) return array;
  const [pivo, ...resto] = array;
  const menores = resto.filter((item) => item <= pivo);
  const maiores = resto.filter((item) => item > pivo);
  return [...quicksort(menores), pivo, ...quicksort(maiores)];
}

function contarNoIntervalo(numeros) {
  if (numeros.length === 0) return 0;
  const primeiro = numeros[0];
  const n = numeros.length;
  const limiteInferior = Math.min(primeiro, n);
  const limiteSuperior = Math.max(primeiro, n);
  return numeros.filter((v) => v >= limiteInferior && v <= limiteSuperior).length;
}

// ---------------------------------------------------------
// Definição das telas
// ---------------------------------------------------------
function parseNumberList(str) {
  return str.split(",").map((s) => s.trim()).filter((s) => s.length > 0).map(Number);
}

const algoritmos = [
  {
    id: "primo",
    file: "ehPrimo.js",
    title: "1. Número é primo",
    desc: "Verifica se um número inteiro positivo é divisível apenas por 1 e por ele mesmo.",
    fields: [{ key: "n", label: "n (inteiro)", value: "17" }],
    run(v) {
      const n = Number(v.n);
      const resultado = ehPrimo(n);
      return [
        { t: `> ehPrimo(${n})`, cls: "accent" },
        { t: `${n} é primo? ${resultado}`, cls: resultado ? "ok" : "muted" },
      ];
    },
  },
  {
    id: "soma",
    file: "somatorio.js",
    title: "2. Somatório",
    desc: "Soma todos os valores de um conjunto de números.",
    fields: [{ key: "lista", label: "números (separados por vírgula)", value: "1, 2, 3, 4, 5" }],
    run(v) {
      const numeros = parseNumberList(v.lista);
      const soma = somatorio(numeros);
      return [
        { t: `> somatorio([${numeros.join(", ")}])`, cls: "accent" },
        { t: `Soma = ${soma}`, cls: "ok" },
      ];
    },
  },
  {
    id: "fib",
    file: "fibonacci.js",
    title: "3. Fibonacci",
    desc: "Calcula o termo N da sequência de Fibonacci e exibe os N primeiros termos.",
    fields: [{ key: "n", label: "n (termo)", value: "10" }],
    run(v) {
      const n = Number(v.n);
      const termo = fibonacci(n);
      const seq = sequenciaFibonacci(n);
      return [
        { t: `> fibonacci(${n})`, cls: "accent" },
        { t: `Termo ${n} = ${termo}`, cls: "ok" },
        { t: `> sequenciaFibonacci(${n})`, cls: "accent" },
        { t: `[${seq.join(", ")}]`, cls: "ok" },
      ];
    },
  },
  {
    id: "mdc",
    file: "mdc.js",
    title: "4. Máximo Divisor Comum",
    desc: "Calcula o MDC entre dois números usando o Algoritmo de Euclides.",
    fields: [
      { key: "a", label: "a", value: "48" },
      { key: "b", label: "b", value: "18" },
    ],
    run(v) {
      const a = Number(v.a), b = Number(v.b);
      const resultado = mdc(a, b);
      return [
        { t: `> mdc(${a}, ${b})`, cls: "accent" },
        { t: `MDC = ${resultado}`, cls: "ok" },
      ];
    },
  },
  {
    id: "quicksort",
    file: "quicksort.js",
    title: "5. Ordenação (Quicksort)",
    desc: "Ordena um array de números em ordem crescente.",
    fields: [{ key: "lista", label: "números (separados por vírgula)", value: "9, 3, 7, 1, 8, 2, 5" }],
    run(v) {
      const numeros = parseNumberList(v.lista);
      const ordenado = quicksort(numeros);
      return [
        { t: `> quicksort([${numeros.join(", ")}])`, cls: "accent" },
        { t: `Original: [${numeros.join(", ")}]`, cls: "muted" },
        { t: `Ordenado: [${ordenado.join(", ")}]`, cls: "ok" },
      ];
    },
  },
  {
    id: "contagem",
    file: "contarNoIntervalo.js",
    title: "6. Contagem no Intervalo",
    desc: "Conta quantos valores de um conjunto de N números estão entre o primeiro valor informado e N (ambos inclusive).",
    fields: [{ key: "lista", label: "números (separados por vírgula)", value: "3, 1, 2, 3, 4, 5, 6" }],
    run(v) {
      const numeros = parseNumberList(v.lista);
      const n = numeros.length;
      const primeiro = numeros[0];
      const resultado = contarNoIntervalo(numeros);
      return [
        { t: `> contarNoIntervalo([${numeros.join(", ")}])`, cls: "accent" },
        { t: `N = ${n}, primeiro valor = ${primeiro}`, cls: "muted" },
        { t: `Quantidade no intervalo: ${resultado}`, cls: "ok" },
      ];
    },
  },
];

// ---------------------------------------------------------
// Renderização
// ---------------------------------------------------------
let activeId = algoritmos[0].id;

const sidebar = document.getElementById("sidebar");
const paneTitle = document.getElementById("paneTitle");
const paneDesc = document.getElementById("paneDesc");
const fieldsHost = document.getElementById("fieldsHost");
const consoleBody = document.getElementById("consoleBody");
const statusTag = document.getElementById("statusTag");
const runBtn = document.getElementById("runBtn");

function renderSidebar() {
  sidebar.innerHTML = '<div class="sidebar-label">algoritmos/</div>';
  algoritmos.forEach((algo) => {
    const item = document.createElement("div");
    item.className = "file-item" + (algo.id === activeId ? " active" : "");
    item.innerHTML = `<span class="file-icon" style="background: var(--accent-dim)"></span>${algo.file}`;
    item.addEventListener("click", () => {
      activeId = algo.id;
      renderSidebar();
      renderPane();
    });
    sidebar.appendChild(item);
  });
}

function renderPane() {
  const algo = algoritmos.find((a) => a.id === activeId);
  paneTitle.textContent = algo.title;
  paneDesc.textContent = algo.desc;

  fieldsHost.innerHTML = "";
  const row = document.createElement("div");
  row.className = "field-row";
  algo.fields.forEach((f) => {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = f.label;
    label.setAttribute("for", "in-" + f.key);
    const input = document.createElement("input");
    input.type = "text";
    input.id = "in-" + f.key;
    input.value = f.value;
    input.dataset.key = f.key;
    wrap.appendChild(label);
    wrap.appendChild(input);
    row.appendChild(wrap);
  });
  fieldsHost.appendChild(row);

  consoleBody.innerHTML = '<span class="muted console-line">// aguardando execução...</span>';
  statusTag.textContent = "";
}

function executar() {
  const algo = algoritmos.find((a) => a.id === activeId);
  const values = {};
  algo.fields.forEach((f) => {
    values[f.key] = document.getElementById("in-" + f.key).value;
  });

  consoleBody.innerHTML = "";
  try {
    const linhas = algo.run(values);
    linhas.forEach((linha) => {
      const el = document.createElement("span");
      el.className = "console-line " + (linha.cls || "");
      el.textContent = linha.t;
      consoleBody.appendChild(el);
    });
    statusTag.textContent = "✓ executado";
    statusTag.className = "ok";
  } catch (e) {
    const el = document.createElement("span");
    el.className = "console-line err";
    el.textContent = "Erro: " + e.message;
    consoleBody.appendChild(el);
    statusTag.textContent = "✗ erro";
    statusTag.className = "err";
  }
}

runBtn.addEventListener("click", executar);

// Tema
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  if (current === "light") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else if (current === "dark") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", "light");
  }
});

renderSidebar();
renderPane();
</script>
</body>
</html>
